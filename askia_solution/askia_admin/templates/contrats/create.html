{%extends 'layouts/base.html' %}
{% load static%}


{%block style%}

{%endblock%}


{%block head_js%}

{%endblock%}

{%block body%}
<div class="container-fluid">

  <form action="{% url 'askia_admin:save_contrat' %}" class="mx-4 mt-4" method="post">
    {% csrf_token %}

    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2">Client Info</legend>
      <div class="row g-3">
        <div class="col-md-6 mb-3">
          <label for="nomClt" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/user-solid.svg' %}" alt=""></span>
            <input type="text" id="nomClt" class="form-control" placeholder="Full Name" name="nom">
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="contact" class="form-label">Contact</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/phone-solid.svg' %}" alt=""></span>
            <input id="contact" type="text" class="form-control" placeholder="+228" name="contact">
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6 mb-3">
          <label for="address" class="form-label">Address</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/house-solid.svg' %}" alt=""></span>
            <input type="text" id="address" class="form-control" placeholder="Address" name="adresse">
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="date_naissance" class="form-label">Date Naiss</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/calendar-days-solid.svg' %}" alt=""></span>
            <input type="date" class="form-control" placeholder="Date Naiss" name="date_naissance">
          </div>
        </div>
      </div>

    </fieldset>

    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2"> Contrat Info</legend>

      <div class="row g-3">
        <div class="col-md-4 mb-3">
          <label for="montant" class="form-label">Montant</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/piggy-bank-solid.svg' %}" alt=""></span>
            <input type="number" class="form-control" placeholder="En FCFA" name="montant">
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label for="duree" class="form-label">Durée</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/clock-solid.svg' %}" alt=""></span>
            <input type="number" class="form-control" placeholder="En mois" name="duree">
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <label for="date_sgnture" class="form-label">Date Signature</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/calendar-days-solid.svg' %}" alt=""></span>
            <input type="date" class="form-control" placeholder="" name="date_sgnture">
          </div>
        </div>
      </div>

    </fieldset>
    <!--  -->
    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2">Témoins Info</legend>
      <div id="temoins">
        <div class="temoin form-row">
          <div class="col-md-12">
            <div class="  row g-3">
              <div class="col-md-4">
                <label for="nomTemoin" class="form-label">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/user-solid.svg' %}" alt=""></span>
                  <input id="inpu-id" type="text" class="form-control" placeholder="Full Name" name="nomTemoin">
                </div>
              </div>
              <div class="col-md-4">
                <label for="contactTemoin" class="form-label">Telephone</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/phone-solid.svg' %}" alt=""></span>
                  <input type="text" class="form-control" placeholder="+228" name="contactTemoin">
                </div>
              </div>
              <div class="col-md-4">
                <label for="adresseTemoin" class="form-label">Address</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/house-solid.svg' %}" alt=""></span>
                  <input type="text" class="form-control" placeholder="Address" name="adresseTemoin">
                </div>
              </div>
            </div>
            <!--  -->
            <!-- <div class="col-md-12 text-right">
              <span class="add-temoin"><i class="bi bi-plus-lg text-success"></i></span>
              <button type="button" class="btn btn-sm remove-temoin " style="display:none;"><i class="bi bi-x-lg text-danger"></i></button>
            </div> -->
            <!--  -->
             <!-- Boutons Add et Remove -->
            <div class="col-md-12 text-right mt-3">
              <span class="add-temoin"><i class="bi bi-plus-lg text-success"></i> Add</span>
              <button type="button" class="btn btn-sm remove-temoin" style="display:none;"><i class="bi bi-x-lg text-danger"></i> Remove</button>
            </div>
        <!-- Fin Boutons Add et Remove -->
      </div>
          </div>
        </div>
      </div>
      
    </fieldset>
    

    <div id="errorMessages"></div>

    <button type="submit" class="btn btn-primary ">Enregister</button>

    <div class="row justify-content-center">
      <div class="col-md-4 text-center"> 
        <button type="submit" class="btn btn-primary mt-4 w-100 mx-auto">Enregistrer</button>

      </div>
    </div>

   
  </form>
</div>


{%endblock%}

<script>
  
$(document).ready(function () {


  // Add temoin
  $(".add-temoin").click(function () {
    var clone = $(".temoin:first").clone(true);
    clone.find("input").val(""); 
    clone.find(".add-temoin").remove(); 
    clone.find(".remove-temoin").show();
    $("#temoins").append(clone);
  });

  // Remove temoin
  $("#temoins").on("click", ".remove-temoin", function () {
    $(this).closest(".temoin").remove();
  });

});

</script>
