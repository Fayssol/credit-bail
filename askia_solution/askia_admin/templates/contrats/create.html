{%extends 'layouts/base.html' %}
{% load static%}


{%block style%}

{%endblock%}


{%block header_js%}

{%endblock%}

{%block body%}
<div class="content-fluid">

  <form id="idForm" action="{% url 'askia_admin:save_contrat' %}" class="mx-4 mt-4" method="post">
    {% csrf_token %}

    <fieldset class="form-group border p-3 shadow-sm border border-dark" >
      <legend class="w-auto px-2">Client Info</legend>
      <div class="form-row mb-3">
        <div class="col-md-6 mb-3 ">
            <label for="" class="form-label" >Full Name</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/user-solid.svg'%}" alt=""></div>
              </div>
              <input type="text" 
             id="nomClt" class="form-control" placeholder="Full Name"  name="nom" >
            </div>
            <!-- <input type="text" class="form-control " placeholder="Full Name"> -->
        </div>
        <div class="col-md-6 ">
          <label for="contact" class="form-label">Contact</label>
          <div class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text"><img src="{%static 'img/phone-solid.svg' %}" alt=""></div>
            </div>
            <input id="contact" type="text" class="form-control" placeholder="+228" name="contact">
          </div>
        </div>
    </div>

    <div class="form-row ">
      <div class="col-md-6">
          <label for="adress" class="form-label">Address</label>
          <div class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text"><img src="{%static 'img/house-solid.svg' %}" alt=""></div>
            </div>
            <input id="adress" type="text" id="address" class="form-control" placeholder="Address" name="adresse">
          </div>
      </div>
      <div class="col-md-6 ">
        <label for="" class="form-label">Date Naiss</label>
        <div class="input-group mb-2">
          <div class="input-group-prepend">
            <div class="input-group-text"><img src="{% static 'img/calendar-days-solid.svg' %}" alt=""></div>
          </div>
          <input id="dateNaiss" type="date" class="form-control" placeholder="Date Naiss" name="date_naissance">
        </div>
      </div>

    </fieldset>
    
   
    <fieldset  class="form-group border p-3 shadow-sm border border-dark">
      <legend class="w-auto px-2"> Contrat Info</legend>
      <div class="form-row">
        <div class="col-md-4">
          <label for="montant" class="form-label">Montant</label>
          <div class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text"><img src="{%static 'img/piggy-bank-solid.svg' %}" alt=""></div>
            </div>
            <input type="number"  id="montant" class="form-control" placeholder="En FCFA" name="montant">
          </div>
        </div>
        <div class="col-md-4">
          <label for="duree" class="form-label">Durée</label>
          <div class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text"><img src="{%static 'img/clock-solid.svg' %}" alt=""></div>
            </div>
            <input id="duree" type="number" class="form-control" placeholder="En mois" name="duree">
          </div>
        </div>

        <div class="col-md-4">
          <label for="dateSign" class="form-label">Date Signature</label>
          <div class="input-group mb-2">
            <div class="input-group-prepend">
              <div class="input-group-text"><img src="{%static 'img/calendar-days-solid.svg' %}" alt=""></div>
            </div>
            <input id="dateSign" type="date" class="form-control" placeholder="" name="date_sgnture">
          </div>
        </div>

      </div>
    </fieldset>

    <fieldset class="form-group border p-3 shadow-sm border border-dark">
      <legend class="w-auto px-2">Témoins Info</legend>
      <div id="temoins">
        <div class="temoin form-row">
          <div class="col-md-4">
            <label for="nomTemoin" class="form-label">Full Name</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/user-solid.svg' %}" alt=""></div>
              </div>
              <input id="" type="text" class="form-control nomTemoin" placeholder="Full Name" name="nomTemoin">
            </div>
          </div>
          <div class="col-md-4">
            <label for="" class="form-label">Telephone</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/phone-solid.svg' %}" alt=""></div>
              </div>
              <input id="" type="text" class="form-control contactTmn" placeholder="+228" name="contactTemoin">
            </div>
          </div>
          <div class="col-md-4">
            <label for="" class="form-label">Address</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/house-solid.svg' %}" alt=""></div>
              </div>
              <input id="" type="text" class="form-control adressTmn" placeholder="Address" name="adresseTemoin">
            </div>
          </div>
          <div class="col-md-12 text-right">
            <button type="button" class="btn btn-primary btn-sm add-temoin">Add temoin</button>
            <button type="button" class="btn btn-danger btn-sm remove-temoin" style="display:none;">Remove temoin</button>
            
          </div>
        </div>
      </div>
    <div>
      <button type="submit" class="btn btn-success btn-sm btn-save">Save</button>

    </div>
    </fieldset>

    <div id="errorMessages"></div>

  </form>
</div>

{%endblock%}
