{%extends 'layouts/base.html' %}
{% load static%}


{%block style%}

{%endblock%}


{%block head_js%}

{%endblock%}

{%block body%}
<div class="container-fluid">

  <form id="contratForms" action="{% url 'askia_admin:save_contrat' %}" class="mx-4 mt-4" method="post">
    {% csrf_token %}

    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2">Client Info</legend>
      <div class="row g-3">
        <div class="col-md-6 mb-3">
          <label for="nomClt" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/user-solid.svg' %}" alt=""></span>
            <input type="text" id="contrat" class="form-control" placeholder="Full Name" name="nom">
          </div>
          <span id="contratError" class="error text-danger"></span>
        </div>

        <div class="col-md-6 mb-3">
          <label for="contact" class="form-label">Contact</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/phone-solid.svg' %}" alt=""></span>
            <input id="contact" type="text" class="form-control" placeholder="+228" name="contact">
          </div>
          <span id="contactError" class="error text-danger"></span>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-md-6 mb-3">
          <label for="address" class="form-label">Address</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/house-solid.svg' %}" alt=""></span>
            <input type="text" id="address" class="form-control" placeholder="Address" name="adresse">
          </div>
          <span id="adresseError" class="error text-danger"></span>
        </div>

        <div class="col-md-6 mb-3">
          <label for="date_naissance" class="form-label">Date Naissance</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/calendar-days-solid.svg' %}" alt=""></span>
            <input type="date" id="dateN" class="form-control" placeholder="Date Naiss" name="date_naissance">
          </div>
          <span id="dnError" class="error text-danger"></span>
        </div>
      </div>

    </fieldset>

    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2"> Contrat Info</legend>

      <div class="row g-3">
        <div class="col-md-4 mb-3">
          <label for="montant" class="form-label">Montant</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/piggy-bank-solid.svg' %}" alt=""></span>
            <input type="number" id="montantC" class="form-control" placeholder="En FCFA" name="montantC">
          </div>
          <span id="montantError2" class="error text-danger"></span>
        </div>

        <div class="col-md-4 mb-3">
          <label for="duree" class="form-label">Durée</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/clock-solid.svg' %}" alt=""></span>
            <input type="number" id="dureeC" class="form-control" placeholder="En mois" name="duree">
          </div>
          <span id="dureeError" class="error text-danger"></span>
        </div>

        <div class="col-md-4 mb-3">
          <label for="date_sgnture" class="form-label">Date Signature</label>
          <div class="input-group">
            <span class="input-group-text"><img src="{% static 'img/calendar-days-solid.svg' %}" alt=""></span>
            <input type="date" id="dateS" class="form-control" placeholder="" name="date_sgnture" value="{{date_actuelle}}" max="{{date_actuelle}}">
          </div>
          <span id="dateSgnError" class="error text-danger"></span>
        </div>
      </div>

    </fieldset>
    <!--  -->
    <fieldset class="border p-3 shadow border-dark">
      <legend class="w-auto px-2">Témoins Info</legend>
      <div id="temoins">
        <div class="temoin form-row">
          <div class="col-md-12">
            <div class="  row g-3">
              <div class="col-md-4">
                <label for="nomTemoin" class="form-label">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/user-solid.svg' %}" alt=""></span>
                  <input id="nameT" type="text" class="form-control" placeholder="Full Name" name="nomTemoin">
                </div>
                <span id="nametError" class="error text-danger"></span>
              </div>

              <div class="col-md-4">
                <label for="contactTemoin" class="form-label">Telephone</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/phone-solid.svg' %}" alt=""></span>
                  <input type="text" id="phone" class="form-control" placeholder="+228" name="contactTemoin">
                </div>
                <span id="phoneError" class="error text-danger"></span>
              </div>
              <div class="col-md-4">
                <label for="adresseTemoin" class="form-label">Address</label>
                <div class="input-group">
                  <span class="input-group-text"><img src="{% static 'img/house-solid.svg' %}" alt=""></span>
                  <input type="text" id="adresseT" class="form-control" placeholder="Address" name="adresseTemoin">
                </div>
                <span id="adressetError" class="error text-danger"></span>
              </div>
            </div>
            <!--  -->
            <!-- <div class="col-md-12 text-right">
              <span class="add-temoin"><i class="bi bi-plus-lg text-success"></i></span>
              <button type="button" class="btn btn-sm remove-temoin " style="display:none;"><i class="bi bi-x-lg text-danger"></i></button>
            </div> -->
            <!--  -->
             <!-- Boutons Add et Remove -->
            <div class="col-md-12 text-right mt-3">
              <span class="add-temoin"><i class="bi bi-plus-lg text-success"></i> Add</span>
              <button type="button" class="btn btn-sm remove-temoin" style="display:none;"><i class="bi bi-x-lg text-danger"></i> Remove</button>
            </div>
        <!-- Fin Boutons Add et Remove -->
      </div>
          </div>
        </div>
      </div>
      
    </fieldset>
    

    <div id="errorMessages"></div>

    

    <div class="row justify-content-center mb-4">
      <div class="col-md-4 text-center"> 
        <button type="button" id="contratBtn" class="btn btn-primary mt-4 w-100 mx-auto">Enregistrer</button>

      </div>
    </div>

   
  </form>
</div>


{%endblock%}

<script>
  $(document).ready(function () {
      // Add temoin
      $(".add-temoin").click(function () {
          if (validateTemoin()) {
              var clone = $(".temoin:first").clone(true);
              clone.find("input").val(""); 
              clone.find(".add-temoin").remove(); 
              clone.find(".remove-temoin").show();
              $("#temoins").append(clone);
          }
      });

      // Remove temoin
      $("#temoins").on("click", ".remove-temoin", function () {
          $(this).closest(".temoin").remove();
      });

      // Validation function
      function validateTemoin() {
          var isValid = true;
          $(".temoin").each(function () {
              var fullname = $(this).find("input[name='nomTemoin']").val();
              var telephone = $(this).find("input[name='contactTemoin']").val();
              var address = $(this).find("input[name='adresseTemoin']").val();

              if (fullname == "") {
                  $(this).find("#nametError").text("Le nom est requis");
                  isValid = false;
              } else {
                  $(this).find("#nametError").text("");
              }

              if (telephone == "") {
                  $(this).find("#phoneError").text("Le phone est requis");
                  isValid = false;
              } else {
                  $(this).find("#phoneError").text("");
              }

              if (address == "") {
                  $(this).find("#adressetError").text("L'adresse est requise");
                  isValid = false;
              } else {
                  $(this).find("#adressetError").text("");
              }
          });
          return isValid;
      }
  });
</script>
