{%extends 'layouts/base.html' %}
{% load static%}

{%block style%}

<link rel="stylesheet" href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.css" />

<link rel="stylesheet" href="{% static '/css/responsive.dataTables.min.css' %}">
<link rel="stylesheet" href="{% static '/css/dataTables.bootstrap5.min.css' %}">

<!--  -->
<!-- <link href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.css">
<link href="https://cdn.datatables.net/rowreorder/1.5.0/css/rowReorder.dataTables.css">
<link href="https://cdn.datatables.net/responsive/3.0.1/css/responsive.dataTables.css"> -->

  
{%endblock%}


{%block head_js%}

{%endblock%}

{%block body%}
<div class="row">
	<div class="col-12">
		<div class="card card-default">
			<div class="card-header card-header-border-bottom d-flex justify-content-between">
				
                <!--  -->
                <div class="d-grid gap-2 d-md-block">
                  <button type="button" class="btn btn-outline-secondary mx-4">PDF</button>
                  <button type="button" class="btn btn-outline-secondary">EXCEL</button>
                </div>
               
                <button type="button" class="btn btn-secondary btn-pill" data-bs-toggle="modal" data-bs-target="#exampleModalLg">
                  <span class="add-temoin"><i class="bi bi-plus-lg"></i></span>
                  Ajouter</button>
          

			</div>

			<div class="card-body">

				<div class="basic-data-table">
                    <form id="date_filter" class="ms-auto mb-4" method="POST">
                        {% csrf_token %}
                         <input type="hidden" name="csrfmiddlewaretoken"> 
                        <div class="row ">
                            <div class="col">
                                <input name="from_date" id="from_date" required class="form-control" type="date"
                                       data-date-format="YYYY-MM-DD HH:MM:SS">
                            </div>
                            <div class="col">
                                <input name="to_date" readonly id="to_date" required class="form-control"
                                       type="date" data-date-format="YYYY-MM-DD HH:MM:SS">
                            </div>
                            <div class="col d-flex align-self-center">
                                <button style="font-size: small" class="btn btn-primary">Filtrer</button>
                            </div>
                        </div>
                    </form>

                        <!-- <table id="transactions_table" class="display nowrap " style="width:100%">
                        
                            
                        </table> -->

                        <!-- example -->
                        <table id="contrats_table" class="table table-hover align-middle mb-0" style="width:100%">
                          <h4>Liste des Contrats</h4>
                          
                        </table>






                </div>
</div>
</div>
</div>



{%endblock%}

{%block footer_js%}
<script src="{%static '/js/jquery.datatables.min.js' %}"></script>
<script src="{% static '/js/datatables.bootstrap4.min.js' %}"></script>
<script src="https://cdn.datatables.net/2.0.3/js/dataTables.js"></script>
<script>
  $(document).ready(function() {
     $('#contrats-table')
     .addClass( 'nowrap' )
     .dataTable( {
         responsive: true,
         columnDefs: [
             { targets: [-1, -3], className: 'dt-body-right' }
         ]
     });
 });

</script>

<script>
   
var TOKEN = $('input[name="csrfmiddlewaretoken"]').val();
function loadData(initial_date, finale_date) {

    new DataTable('#contrats_table', {
    responsive: true,
    // rowReorder: true,
    // rowReorder: {
    //     selector: 'td:nth-child(2)'
    // },
    
    serverSide: true,
    paging: true,
    processing: true,
    stateSave: true,
    'lengthMenu': [10, 25, 50, 100, 150, 200, 300, 500],
    searching: true,
    sort: true,
    ajax: {
            url : "{% url 'askia_admin:ajax_contrat_list' %}",
            type: 'POST',
            headers: {
            'X-CSRFToken': TOKEN
            },
            data: {

            "from_date": initial_date,
            "to_date": finale_date,

            },
        
        },
        language: {
            processing: "Traitement en cours...",
            search: "Rechercher&nbsp;:",
            lengthMenu: "Afficher _MENU_ &eacute;l&eacute;ments",
            info: "Affichage de l'&eacute;lement _START_ &agrave; _END_ sur _TOTAL_ &eacute;l&eacute;ments",
            infoEmpty: "Affichage de l'&eacute;lement 0 &agrave; 0 sur 0 &eacute;l&eacute;ments",
            infoFiltered: "(filtr&eacute; de _MAX_ &eacute;l&eacute;ments au total)",
            infoPostFix: "",
            loadingRecords: "Chargement en cours...",
            zeroRecords: "Aucun &eacute;l&eacute;ment &agrave; afficher",
            emptyTable: "Aucune donnée disponible dans le tableau",
            paginate: {
                first: "Premier",
                previous: "Pr&eacute;c&eacute;dent",
                next: "Suivant",
                last: "Dernier"
            },
            aria: {
                sortAscending: ": activer pour trier la colonne par ordre croissant",
                sortDescending: ": activer pour trier la colonne par ordre décroissant"
            }
        },
       // langage: langage,
        columns: [
            // {data: 'id', visible: false},
            { data: 'date_contrat', visible: true ,title:"Date Sign."},
            { data: 'client', visible: true, title:"Nom du Client" },
            { data: 'montant_contrat', visible: true,title:"Montant A Payer" },
            { data: 'duree', visible: true,title:"Durée (mois)" },
            { data: 'status', visible: true, title:"Status" },
            { data: 'etat', visible: true,title:"Etat" },
            
        ],
        columnDefs: [
            
            //  { className: "dt-center", targets: "_all" }, // Centrer tous les contenus de colonnes
             { targets: "_all", className: 'dt-right' }
           



            
        ],
     
});

}




$(document).ready(function () {

loadData()

$('form#date_filter').on('submit', function (e) {

    e.preventDefault();

    var from_date = $('#from_date').val()
    var to_date = $('#to_date').val()
    $('#contrats_table').DataTable().destroy()
    loadData(from_date, to_date)

});



$('#from_date').on('change', function () {

$('#to_date').removeAttr("readonly")
$('#to_date').attr("min", $(this).val())
$('#to_date').val($(this).val())

});

});

</script>
{%endblock%}
