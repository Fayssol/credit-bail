{%extends 'layouts/base.html' %}
{% load static%}

{%block style%}


{%endblock%}


{%block head_js%}

{%endblock%}

{%block body%}
{% include 'pdf/modal.html' %}

<div class="row mt-4 shadow ">
  <div class="col-12 ">



    <div class="row">
      <div class="col-12">

        <div class="card card-default">
          <div class="card-header card-header-border-bottom d-flex justify-content-between">

            <!--  -->
            <div class="d-grid gap-2 d-md-block">
              <button type="button" class="btn btn-outline-secondary mx-4  fs-6 shadow-sm" id="contratsPdf"> <span
                  class="spinner-dr  d-none">
                  <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                  Un instant ...
                </span>
                <span class="btn-spinner-test-dr">
                  PDF
                </span></button>













              <button type="button" class="btn btn-outline-secondary fs-6 shadow-sm">EXCEL</button>
            </div>
            <a href="{% url 'askia_admin:contrat_form' %}">
              <button type="button" class="btn btn-primary btn-pill fw-bold fs-6 shadow-sm" data-bs-toggle="modal"
                data-bs-target="#exampleModalLg">
                <span class="add-temoin"><i class="bi bi-plus-lg"></i></span>
                Ajouter</button>
            </a>



          </div>

          <div class="card-body">

            <div class="basic-data-table ">
              <form id="date_filter" class="ms-auto mb-4" method="POST">
                {% csrf_token %}
                <input type="hidden" name="csrfmiddlewaretoken">
                <div class="row ">
                  <div class="col">
                    <input name="from_date" id="from_date" required class="form-control" type="date"
                      data-date-format="YYYY-MM-DD HH:MM:SS">
                  </div>
                  <div class="col">
                    <input name="to_date" readonly id="to_date" required class="form-control" type="date"
                      data-date-format="YYYY-MM-DD HH:MM:SS">
                  </div>
                  <div class="col d-flex align-self-center">
                    <button style="font-size: small" class="btn btn-secondary fw-bold fs-6 shadow-sm">Filtrer</button>
                  </div>
                </div>
              </form>
              <div class="table-responsive">
                <table id="contrats_table" class="table table-hover align-middle mb-0" style="width:100%">
                  <h4>Liste des Contrats</h4>

                </table>
              </div>







            </div>
          </div>
        </div>
      </div>



      {%endblock%}


      {%block footer_js%}

      <script src="{% static '/js/ajax_contrat.js' %}"></script>

      <script src="{% static '/js/contrats_pdf.js' %}"></script>

      {%endblock%}
