{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Se connecter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <style>
    body {
      background-image: url("{% static 'img/express-3.jpg' %}");
      background-size: cover;
      background-position: center;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
        position: relative;
      max-width: 400px;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
    }

    .titre {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      background-color: rgba(39, 56, 116, 255);
      color: white;
      padding: 10px 0;
      text-align: center;

    }

    .mon-btn {
      text-align: center;
    }

    .btn {
      background-color: rgba(39, 56, 116, 255);
      color: white;
    }

    .btn:hover {
      background-color: orange;
    }
    .login_form{
        margin-top: 80px;
    }
  </style>
</head>
<body>

  <div class="login-container mt-4">
    <div class="titre">
      <h3 class="text-center mb-4 ">Connectez-vous</h3>
    </div>
    <form action="{% url 'askia_admin:login_verify' %}" method="post" id="login_form" class="login_form">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label ">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="username" name="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" class="form-control" id="password" name="password">
      </div>
      <div class="mon-btn">
        <button type="button" id="btn" class="btn">Se connecter</button>
      </div>
    </form>
  </div>

  <script src="{% static '/js/jQuery.js' %}"></script>
  <script>
    $('#btn').click(function(event){
      event.preventDefault(); // Empêcher la soumission automatique du formulaire

      var username = $("#username").val();
      var password = $('#password').val();
      var form = $("#login_form");

      if (username !== "" && password !== "") {
        form.submit();
      } else {
        alert("Veuillez remplir tous les champs");
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
