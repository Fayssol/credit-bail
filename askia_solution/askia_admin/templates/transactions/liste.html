{%extends 'layouts/base.html' %}
{% load static%}


{%block style%}
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500|Poppins:400,500,600,700|Roboto:400,500" rel="stylesheet" />
<link href="https://cdn.materialdesignicons.com/4.4.95/css/materialdesignicons.min.css" rel="stylesheet" />
<link href="{% static '/css/datatables.bootstrap4.min.css' %}" rel='stylesheet'>
<link rel="stylesheet" href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.css" />

<link rel="stylesheet" href="{% static '/css/responsive.dataTables.min.css' %}">
<link rel="stylesheet" href="{% static '/css/dataTables.bootstrap5.min.css' %}">

<!--  -->
<!-- <link href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.css">
<link href="https://cdn.datatables.net/rowreorder/1.5.0/css/rowReorder.dataTables.css">
<link href="https://cdn.datatables.net/responsive/3.0.1/css/responsive.dataTables.css"> -->

  
{%endblock%}

{%block head_js%}
    
{%endblock%}

{%block body%}
<div class="row">
	<div class="col-12">
		<div class="card card-default">
			<div class="card-header card-header-border-bottom d-flex justify-content-between">
				<h2>Liste des transactions</h2>
                <!--  -->
                <button type="button" class="btn btn-secondary " data-bs-toggle="modal" data-bs-target="#exampleModalLg">Ajouter</button>
          

			</div>

			<div class="card-body">

				<div class="basic-data-table">
                    <form id="date_filter" class="ms-auto mb-4" method="POST">
                        {% csrf_token %}
                         <input type="hidden" name="csrfmiddlewaretoken"> 
                        <div class="row ">
                            <div class="col">
                                <input name="from_date" id="from_date" required class="form-control" type="date"
                                       data-date-format="YYYY-MM-DD HH:MM:SS">
                            </div>
                            <div class="col">
                                <input name="to_date" readonly id="to_date" required class="form-control"
                                       type="date" data-date-format="YYYY-MM-DD HH:MM:SS">
                            </div>
                            <div class="col d-flex align-self-center">
                                <button style="font-size: small" class="btn btn-primary">Filtrer</button>
                            </div>
                        </div>
                    </form>

                        <!-- <table id="transactions_table" class="display nowrap " style="width:100%">
                        
                            
                        </table> -->

                        <!-- example -->
                        <table id="transactions_table" class="table table-hover align-middle mb-0" style="width:100%">
                          
                        </table>






                </div>
</div>
</div>
</div>

<!-- modal -->
<div class="modal fade" id="exampleModalLg" tabindex="-1" aria-labelledby="exampleModalLgLabel" aria-hidden="true" style="display: none;">
  <div class="modal-dialog modal-lg">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title h4" id="exampleModalLgLabel">Large modal</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
              <!-- ... -->

<form id="transactionForm" action="{% url 'askia_admin:save_transaction' %}" method="post" class="form-control-sm">
  {% csrf_token %}

    <fieldset class="form-group border p-3 shadow-sm border border-wihte" >
        <legend class="w-auto px-2">Transaction</legend>
        <div class="form-row mb-3">
          <!--  -->
          <div class="col-md-6 mb-3 ">
              <label for="" class="form-label" >Client</label>
              <div class="input-group mb-2">
                <div class="input-group-prepend">
                  <div class="input-group-text"><img src="{%static 'img/user-solid.svg'%}" alt=""></div>
                </div>
                
                <input id="contrat" class="form-control" name="contrat" list="datalistOptions" id="exampleDataList" placeholder="Chercher un client">
                <datalist id="datalistOptions">
                  
                  {% for contrat in contrats %}
                  <option value="{{contrat.client.nom}}">
                    {%endfor%}
                    
                  </datalist>
                  
                </div>
                
                <span id="contratError" class="error text-danger"></span>
       
          </div>

          <div class="col-md-6 ">
            <label for="" class="form-label">Montant</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/piggy-bank-solid.svg' %}" alt=""></div>
              </div>
              <input id="montant" type="number" name="montant_versement" class="form-control" placeholder="Enter un montant">
            </div>
            <span id="montantError" class="error text-danger"></span>
           
          </div>
      </div>
  
      <div class="form-row ">
        <div class="col-md-6">
            <label for="" class="form-label">Date</label>
            <div class="input-group mb-2">
              <div class="input-group-prepend">
                <div class="input-group-text"><img src="{%static 'img/calendar-days-solid.svg' %}" alt=""></div>
              </div>
              <!-- <input id="date" type="date" class="form-control" name="date_versement" placeholder="Enter une date"> -->
              <input id="date" 
                type="date" 
                class="form-control" 
                name="date_versement" 
                placeholder="Enter une date" 
                max="{{ date_actuelle }}" 
                value="{{ date_actuelle }}"
                data-date-format="yyyy/mm/dd"
              >

            </div>
            <span id="dateError" class="error text-danger"></span>
        </div>
        
          <div class="col-md-6">
            <label for="note" class="form-label">Note <span class="text-success">(optionnel)</span></label>
            <div class="input-group mb-2">
                <div class="input-group-prepend">
                    <div class="input-group-text"><img src="{%static 'img/note.svg' %}" alt=""></div>
                </div>
                <input id="note" type="text" name="note" class="form-control" placeholder="Enter une note">
            </div>
            <span id="noteError" class="error text-danger"></span>
        </div>

       

        <button id="transactionBtn" type="button" class="btn btn-primary mt-4">Enregister</button>

      </fieldset>

</form>


          </div>
      </div>
  </div>
</div>
{%endblock%}

{%block footer_js%}
<script src="{%static '/js/jquery.datatables.min.js' %}"></script>
<script src="{% static '/js/datatables.bootstrap4.min.js' %}"></script>
<script src="https://cdn.datatables.net/2.0.3/js/dataTables.js"></script>
<script>
  $(document).ready(function() {
     $('#transactions-table')
     .addClass( 'nowrap' )
     .dataTable( {
         responsive: true,
         columnDefs: [
             { targets: [-1, -3], className: 'dt-body-right' }
         ]
     });
 });

</script>

<script>
   
var TOKEN = $('input[name="csrfmiddlewaretoken"]').val();
function loadData(initial_date, finale_date) {

    new DataTable('#transactions_table', {
    responsive: true,
    // rowReorder: true,
    // rowReorder: {
    //     selector: 'td:nth-child(2)'
    // },
    
    serverSide: true,
    paging: true,
    processing: true,
    stateSave: true,
    'lengthMenu': [10, 25, 50, 100, 150, 200, 300, 500],
    searching: true,
    sort: true,
    ajax: {
            url : "{% url 'askia_admin:ajax_transaction_list' %}",
            type: 'POST',
            headers: {
            'X-CSRFToken': TOKEN
            },
            data: {

            "from_date": initial_date,
            "to_date": finale_date,

            },
        
        },
        language: {
            processing: "Traitement en cours...",
            search: "Rechercher&nbsp;:",
            lengthMenu: "Afficher _MENU_ &eacute;l&eacute;ments",
            info: "Affichage de l'&eacute;lement _START_ &agrave; _END_ sur _TOTAL_ &eacute;l&eacute;ments",
            infoEmpty: "Affichage de l'&eacute;lement 0 &agrave; 0 sur 0 &eacute;l&eacute;ments",
            infoFiltered: "(filtr&eacute; de _MAX_ &eacute;l&eacute;ments au total)",
            infoPostFix: "",
            loadingRecords: "Chargement en cours...",
            zeroRecords: "Aucun &eacute;l&eacute;ment &agrave; afficher",
            emptyTable: "Aucune donnée disponible dans le tableau",
            paginate: {
                first: "Premier",
                previous: "Pr&eacute;c&eacute;dent",
                next: "Suivant",
                last: "Dernier"
            },
            aria: {
                sortAscending: ": activer pour trier la colonne par ordre croissant",
                sortDescending: ": activer pour trier la colonne par ordre décroissant"
            }
        },
       // langage: langage,
        columns: [
            // {data: 'id', visible: false},
            { data: 'nom', visible: true ,title:"Clients"},
            { data: 'contact', visible: true, title:"Contacts" },
            { data: 'date_versement', visible: true,title:"Date Vers." },
            { data: 'montant_versement', visible: true,title:"Montant Versé" },
            { data: 'montant_total_paye', visible: true, title:"Total Versé" },
            { data: 'montant_contrat', visible: true,title:"À Payé" },
            { data: 'reste', visible: true,title:"Reste" },
            { data: 'note', visible: true, title:"Notes" }
        ],
        columnDefs: [
            
            //  { className: "dt-center", targets: "_all" }, // Centrer tous les contenus de colonnes
             { targets: "_all", className: 'dt-right' }
           



            
        ],
     
});

}




$(document).ready(function () {

loadData()

$('form#date_filter').on('submit', function (e) {

    e.preventDefault();

    var from_date = $('#from_date').val()
    var to_date = $('#to_date').val()
    $('#transactions_table').DataTable().destroy()
    loadData(from_date, to_date)

});



$('#from_date').on('change', function () {

$('#to_date').removeAttr("readonly")
$('#to_date').attr("min", $(this).val())
$('#to_date').val($(this).val())

});

});

</script>
{%endblock%}
